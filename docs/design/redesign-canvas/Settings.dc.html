<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pismo Zones · Phone · Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
.pz,.pz *{box-sizing:border-box}
.pz{font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;letter-spacing:-.005em;transition:background .3s,color .3s}
.pz .mono{font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:0}
.pz button{font:inherit;color:inherit}
.pz svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hdr{position:absolute;top:52px;left:16px;right:16px;height:48px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.hdr strong{font-size:17px;font-weight:600}
.iconbtn{width:44px;height:44px;flex:none;border-radius:22px;display:grid;place-items:center;text-decoration:none;cursor:pointer;border:1px solid rgba(127,127,127,.18)}
.iconbtn svg{width:20px;height:20px}
.scroll{position:absolute;top:108px;left:0;right:0;bottom:0;overflow-y:auto;padding:10px 16px 40px;scrollbar-width:none}
.card{position:relative;height:124px;border-radius:26px;overflow:hidden;isolation:isolate;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:#f4f6fb}
.card .sky,.card .scrim{position:absolute;inset:0}
.card .scrim{background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 50%,rgba(0,0,0,.36) 100%)}
.card .content{position:absolute;inset:0;padding:14px 16px 14px 18px;display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.end{align-items:flex-end}
.city{font-size:17px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12.5px;font-weight:500;background:rgba(6,10,24,.34);border:1px solid rgba(255,255,255,.14)}
.chip i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.chip.working i{background:#4ade80}
.chip.soon i,.chip.holiday i{background:#fbbf24}
.time{font-size:46px;font-weight:300;line-height:.9;letter-spacing:-.035em;display:flex;align-items:baseline}
.ampm{font-size:14px;font-weight:500;margin-left:5px;opacity:.85}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;font-weight:500}
.meta .mono{font-size:11.5px;opacity:.8}
.cap{text-align:center;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin:10px 0 22px}
.sec{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin:0 6px 8px}
.group{border-radius:22px;overflow:hidden;margin-bottom:24px}
.srow{min-height:58px;display:flex;align-items:center;gap:14px;padding:8px 14px 8px 16px;position:relative;text-decoration:none;color:inherit}
.srow + .srow::before{content:'';position:absolute;left:52px;right:0;top:0;height:1px;background:rgba(127,127,127,.18)}
.srow .ic{width:22px;height:22px;flex:none;opacity:.8}
.srow .lab{flex:1;font-size:16px}
.srow .val{font-size:15px;opacity:.55;display:flex;align-items:center;gap:6px}
.srow .val svg{width:16px;height:16px}
.segc{display:flex;padding:3px;gap:2px;border-radius:12px;background:rgba(127,127,127,.16)}
.segc button{height:32px;min-width:44px;padding:0 10px;border:0;border-radius:9px;background:transparent;font-size:13.5px;font-weight:500;cursor:pointer;opacity:.7}
.segc button.on{opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.note{font-size:13px;line-height:1.45;opacity:.62;padding:12px 16px 14px;text-wrap:pretty}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;opacity:.55;margin-top:6px}
.brand svg{width:16px;height:16px}
</style>
</helmet>
<div class="pz" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{bg}}; color: {{fg}};">
  <header class="hdr">
    <a class="iconbtn" href="Main.dc.html" aria-label="Close settings" style="background: {{surface}}; color: {{fg}};"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></a>
    <strong>{{t.settings}}</strong>
    <span style="width: 44px; height: 44px;"></span>
  </header>

  <div class="scroll">
    <article class="card" aria-label="{{t.preview}}">
      <div class="sky" style="background: {{sky}};"></div>
      <div class="scrim"></div>
      <div class="content">
        <div class="row"><span class="city">{{city}}</span><span class="{{chipCls}}"><i></i>{{chip}}</span></div>
        <div class="row end">
          <div class="time">{{hm}}<span class="ampm">{{ampm}}</span></div>
          <div class="meta"><span>{{rel}}</span><span class="mono">{{utc}}</span></div>
        </div>
      </div>
    </article>
    <div class="cap">{{t.preview}}</div>

    <div class="sec">{{t.display}}</div>
    <div class="group" style="background: {{surface}};">
      <div class="srow">
        <svg class="i ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
        <span class="lab">{{t.format}}</span>
        <div class="segc" role="group" aria-label="{{t.format}}">
          <button type="button" class="{{f12}}" style="background: {{f12bg}};" aria-pressed="{{f12p}}" onClick="{{set12}}">12h</button>
          <button type="button" class="{{f24}}" style="background: {{f24bg}};" aria-pressed="{{f24p}}" onClick="{{set24}}">24h</button>
        </div>
      </div>
      <div class="srow">
        <svg class="i ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
        <span class="lab">{{t.theme}}</span>
        <div class="segc" role="group" aria-label="{{t.theme}}">
          <sc-for list="{{themes}}" as="m" hint-placeholder-count="3"><button type="button" class="{{m.cls}}" style="background: {{m.bg}};" aria-pressed="{{m.p}}" onClick="{{m.pick}}">{{m.label}}</button></sc-for>
        </div>
      </div>
      <div class="srow">
        <svg class="i ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M8.5 4v2M6 6c.7 3.5 3 6 6 7.5M11 6c-.8 3.6-3.4 6.4-7 8"></path><path d="M13 20l4-9 4 9M14.5 17h5"></path></svg>
        <span class="lab">{{t.language}}</span>
        <div class="segc" role="group" aria-label="{{t.language}}">
          <button type="button" class="{{en}}" style="background: {{enbg}};" aria-pressed="{{enp}}" onClick="{{setEn}}">EN</button>
          <button type="button" class="{{pt}}" style="background: {{ptbg}};" aria-pressed="{{ptp}}" onClick="{{setPt}}">PT</button>
        </div>
      </div>
    </div>

    <div class="sec">{{t.places}}</div>
    <div class="group" style="background: {{surface}};">
      <a class="srow" href="Cities.dc.html">
        <svg class="i ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"></path></svg>
        <span class="lab">{{t.cities}}</span>
        <span class="val">5<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
      </a>
      <div class="srow">
        <svg class="i ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
        <span class="lab">{{t.holidays}}</span>
        <span class="val">{{nextHoliday}}<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
      </div>
    </div>

    <div class="sec">{{t.privacy}}</div>
    <div class="group" style="background: {{surface}};">
      <div class="note">{{t.privacyNote}}</div>
    </div>

    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #e8a33d; stroke-width: 1.8;"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"></path></svg>
      <span>Pismo Zones · {{t.open}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.viewerTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    this.state = { now: Date.now(), use24: true, theme: 'system', lang: 'en' };
    this.h = {
      set12: () => this.setState({ use24: false }),
      set24: () => this.setState({ use24: true }),
      setEn: () => this.setState({ lang: 'en' }),
      setPt: () => this.setState({ lang: 'pt' }),
    };
  }

  componentDidMount() { this.t = setInterval(() => this.setState({ now: Date.now() }), 15000); }
  componentWillUnmount() { clearInterval(this.t); }

  pad(n) { return String(n).padStart(2, '0'); }

  parts(ms, tz) {
    const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', weekday: 'short' });
    const o = {};
    for (const p of f.formatToParts(new Date(ms))) o[p.type] = p.value;
    return { y: +o.year, mo: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute, s: +o.second, wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(o.weekday) };
  }

  sunEl(ms, lat, lon) {
    const rad = Math.PI / 180;
    const d = ms / 86400000 - 10957.5;
    const g = (357.529 + 0.98560028 * d) * rad;
    const q = 280.459 + 0.98564736 * d;
    const L = (q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * rad;
    const e = (23.439 - 0.00000036 * d) * rad;
    const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
    const dec = Math.asin(Math.sin(e) * Math.sin(L));
    const gmst = (((18.697374558 + 24.06570982441908 * d) % 24) + 24) % 24;
    const ha = (gmst * 15 + lon) * rad - ra;
    return Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
  }

  mix(x, y, t) {
    const p = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));
    const A = p(x); const B = p(y);
    return 'rgb(' + A.map((v, k) => Math.round(v + (B[k] - v) * t)).join(',') + ')';
  }

  sky(el) {
    const K = [
      [-90, '#02040b', '#050a1b', '#0a1330'], [-18, '#03060f', '#081129', '#111c42'], [-12, '#060c22', '#0f1c48', '#1f2d5e'],
      [-6, '#0c1a48', '#2b3878', '#5a4a7e'], [-2, '#162c66', '#46508a', '#a8644f'], [2, '#244685', '#5e6a9c', '#c98455'],
      [6, '#28539a', '#5480b4', '#b0957a'], [15, '#265aa8', '#4a7cbb', '#7f9fc0'], [35, '#2259b2', '#3c75c0', '#6f98c6'], [90, '#1e56b2', '#386fbf', '#6893c4'],
    ];
    let i = 0;
    while (i < K.length - 2 && el > K[i + 1][0]) i++;
    const a = K[i]; const b = K[i + 1];
    const t = Math.max(0, Math.min(1, (el - a[0]) / (b[0] - a[0])));
    return 'linear-gradient(180deg, ' + this.mix(a[1], b[1], t) + ' 0%, ' + this.mix(a[2], b[2], t) + ' 58%, ' + this.mix(a[3], b[3], t) + ' 100%)';
  }

  copy(lang) {
    if (lang === 'pt') {
      return {
        settings: 'Ajustes', preview: 'Prévia', display: 'Exibição', format: 'Formato de hora', theme: 'Tema', language: 'Idioma',
        places: 'Lugares', cities: 'Cidades', holidays: 'Feriados', privacy: 'Privacidade',
        privacyNote: 'Os horários são calculados no seu dispositivo. Contamos uso anônimo — sem cookies e sem dados pessoais.',
        open: 'código aberto', system: 'Sistema', dark: 'Escuro', light: 'Claro',
        today: 'Hoje', working: 'Em expediente', off: 'Fora do expediente', soon: 'Começa às 09:00', weekend: 'Fim de semana',
      };
    }
    return {
      settings: 'Settings', preview: 'Preview', display: 'Display', format: 'Time format', theme: 'Theme', language: 'Language',
      places: 'Places', cities: 'Cities', holidays: 'Holidays', privacy: 'Privacy',
      privacyNote: 'Times are computed on your device. We count anonymous usage — no cookies, no personal data.',
      open: 'open source', system: 'System', dark: 'Dark', light: 'Light',
      today: 'Today', working: 'Working', off: 'Off hours', soon: 'Starts 09:00', weekend: 'Weekend',
    };
  }

  renderVals() {
    const s = this.state;
    const t = this.copy(s.lang);
    const light = s.theme === 'light';
    const bg = light ? '#f2f2f5' : '#000';
    const fg = light ? '#0d0f14' : '#f4f6fb';
    const surface = light ? '#ffffff' : '#141518';
    const pill = light ? '#ffffff' : 'rgba(255,255,255,.18)';
    const cities = [
      { name: 'Bangalore', tz: 'Asia/Kolkata', lat: 12.97, lon: 77.59 },
      { name: 'São Paulo', tz: 'America/Sao_Paulo', lat: -23.55, lon: -46.63 },
    ];
    const c = cities.find((x) => x.tz === this.viewerTz) || cities[1];
    const p = this.parts(s.now, c.tz);
    const m = p.h * 60 + p.mi;
    let kind = 'off'; let chip = t.off;
    if (p.wd === 0 || p.wd === 6) { kind = 'weekend'; chip = t.weekend; }
    else if (m >= 540 && m < 1080) { kind = 'working'; chip = t.working; }
    else if (m >= 420 && m < 540) { kind = 'soon'; chip = t.soon; }
    const offMin = Math.round((Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(s.now / 1000) * 1000) / 60000);
    const a = Math.abs(offMin);
    const themes = [['system', t.system], ['dark', t.dark], ['light', t.light]].map((x) => ({
      label: x[1], cls: s.theme === x[0] ? 'on' : '', bg: s.theme === x[0] ? pill : 'transparent', p: s.theme === x[0] ? 'true' : 'false',
      pick: () => this.setState({ theme: x[0] }),
    }));
    const on = (v) => (v ? 'on' : '');
    return Object.assign({}, this.h, {
      t, bg, fg, surface, themes,
      sky: this.sky(this.sunEl(s.now, c.lat, c.lon)),
      city: c.name, chip, chipCls: 'chip ' + kind,
      hm: s.use24 ? this.pad(p.h) + ':' + this.pad(p.mi) : (((p.h + 11) % 12) + 1) + ':' + this.pad(p.mi),
      ampm: s.use24 ? '' : (p.h < 12 ? 'AM' : 'PM'),
      rel: t.today,
      utc: 'UTC' + (offMin < 0 ? '−' : '+') + Math.floor(a / 60) + (a % 60 ? ':' + this.pad(a % 60) : ''),
      f12: on(!s.use24), f24: on(s.use24), f12bg: !s.use24 ? pill : 'transparent', f24bg: s.use24 ? pill : 'transparent', f12p: String(!s.use24), f24p: String(s.use24),
      en: on(s.lang === 'en'), pt: on(s.lang === 'pt'), enbg: s.lang === 'en' ? pill : 'transparent', ptbg: s.lang === 'pt' ? pill : 'transparent', enp: String(s.lang === 'en'), ptp: String(s.lang === 'pt'),
      nextHoliday: s.lang === 'pt' ? 'Aparecida · 12 out' : 'Aparecida · 12 Oct',
    });
  }
}
</script>
</body>
</html>
