<style>
body{margin:0;background:#000}
.pz,.pz *{box-sizing:border-box}
.pz{font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#f4f6fb;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.pz .mono{font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:0}
.pz button{font:inherit;color:inherit}
.pz svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hdr{position:absolute;top:52px;left:16px;right:16px;height:48px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.iconbtn{width:44px;height:44px;flex:none;border-radius:22px;display:grid;place-items:center;color:#eef2f8;text-decoration:none;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.45);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s}
.iconbtn:active{transform:scale(.94)}
.iconbtn[disabled]{opacity:.32;cursor:default}
.iconbtn svg{width:20px;height:20px}
.seg{display:flex;padding:3px;gap:2px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.seg a{height:38px;padding:0 15px;display:flex;align-items:center;gap:7px;border-radius:19px;font-size:14px;font-weight:500;color:rgba(244,246,251,.6);text-decoration:none}
.seg a.on{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.seg svg{width:16px;height:16px}
.list{position:absolute;top:112px;left:0;right:0;bottom:0;overflow-y:auto;padding:4px 16px 270px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.card{position:relative;flex:none;height:124px;border-radius:26px;overflow:hidden;isolation:isolate;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.card.ref{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.72)}
.card.temp{outline:1.5px dashed rgba(255,255,255,.55);outline-offset:-1.5px}
.card .sky,.card .stars,.card .scrim,.card .arc{position:absolute;inset:0}
.card .sky{z-index:0;transition:background .9s cubic-bezier(.2,.8,.2,1)}
.card .stars{z-index:1}
.star{position:absolute;border-radius:50%;background:#fff}
.card .scrim{z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 50%,rgba(0,0,0,.36) 100%)}
.card .arc{z-index:3;width:100%;height:100%}
.sun{position:absolute;z-index:4;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#fff7e2;box-shadow:0 0 10px 3px rgba(255,238,200,.6),0 0 34px 10px rgba(255,214,150,.22);transition:left .5s cubic-bezier(.2,.8,.2,1),top .5s cubic-bezier(.2,.8,.2,1)}
.sun.down{background:rgba(255,255,255,.06);box-shadow:none;border:1.5px solid rgba(255,255,255,.42);width:9px;height:9px;margin:-4.5px 0 0 -4.5px}
.card .content{position:absolute;inset:0;z-index:5;padding:14px 16px 14px 18px;display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.end{align-items:flex-end}
.title{display:flex;align-items:center;gap:6px;min-width:0}
.city{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.tag{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.2);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12.5px;font-weight:500;white-space:nowrap;background:rgba(6,10,24,.34);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.chip.working i{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.8)}
.chip.soon i,.chip.holiday i{background:#fbbf24}
.time{font-size:46px;font-weight:300;line-height:.9;letter-spacing:-.035em;display:flex;align-items:baseline;text-shadow:0 2px 14px rgba(0,0,0,.18)}
.sec{font-size:15px;font-weight:400;opacity:.45;margin-left:3px;letter-spacing:0}
.ampm{font-size:14px;font-weight:500;margin-left:5px;opacity:.85;letter-spacing:.02em}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;font-weight:500;line-height:1.1}
.meta .mono{font-size:11.5px;opacity:.8}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:44px 16px 24px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,.84) 40px,#000 78px)}
.sentence{align-self:center;max-width:100%;font-size:13.5px;line-height:1.38;padding:9px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);color:rgba(244,246,251,.94);text-align:center;text-wrap:pretty}
.sentence.err{background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.28);color:#fde7b0}
.sugs{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.sug{height:32px;padding:0 12px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.09);font-size:13px;cursor:pointer}
.momentrow{display:flex;align-items:center;justify-content:center;gap:10px}
.moment{height:46px;min-width:196px;padding:0 18px;border-radius:23px;display:flex;align-items:center;gap:10px;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.moment .dot{width:8px;height:8px;flex:none;border-radius:50%;background:#4ade80;animation:pulse 2.4s cubic-bezier(.2,.8,.2,1) infinite}
.moment.pinned .dot{background:#7aa7ff;animation:none}
.moment.preview .dot{background:#fbbf24;animation:none}
.mtext{display:flex;flex-direction:column;line-height:1.18;align-items:flex-start}
.mtext strong{font-size:15px;font-weight:600;letter-spacing:-.01em}
.mtext span{font-size:12px;color:rgba(244,246,251,.6)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.ruler{height:58px;display:flex;align-items:center;gap:4px;padding:0 4px;border-radius:29px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.chev{width:44px;height:44px;flex:none;border:0;background:transparent;border-radius:22px;display:grid;place-items:center;cursor:pointer;color:rgba(244,246,251,.82)}
.chev svg{width:18px;height:18px}
.track{position:relative;flex:1;height:100%;overflow:hidden;cursor:grab;touch-action:none;outline:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
.track:focus-visible{background:rgba(122,167,255,.10)}
.track.drag{cursor:grabbing}
.tk{position:absolute;top:0;bottom:0;width:0}
.tk i{position:absolute;left:-.75px;top:16px;width:1.5px;height:10px;border-radius:1px;background:rgba(255,255,255,.3)}
.tk.major i{top:12px;height:18px;background:rgba(255,255,255,.75)}
.tk.hot i{background:#4ade80}
.tk span{position:absolute;top:35px;left:0;transform:translateX(-50%);font-size:10.5px;color:rgba(244,246,251,.55);font-family:'Geist Mono',ui-monospace,monospace}
.needle{position:absolute;left:50%;top:8px;bottom:22px;width:2px;margin-left:-1px;border-radius:1px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.65)}
.cmd{height:52px;display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;border-radius:26px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.5)}
.cmd:focus-within{border-color:rgba(122,167,255,.6);box-shadow:0 0 0 4px rgba(122,167,255,.14)}
.cmd > svg{width:18px;height:18px;flex:none;opacity:.7}
.cmd input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:#fff;font:inherit;font-size:16px}
.cmd input::placeholder{color:rgba(244,246,251,.46)}
.clear{width:40px;height:40px;flex:none;border-radius:20px;border:0;background:rgba(255,255,255,.1);display:grid;place-items:center;cursor:pointer}
.clear svg{width:16px;height:16px}
.toast{position:absolute;left:50%;top:116px;transform:translateX(-50%);z-index:20;padding:10px 16px;border-radius:20px;background:rgba(30,32,40,.94);border:1px solid rgba(255,255,255,.12);font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.moment .dot{animation:none}.card .sky,.sun{transition:none}}
</style>
</helmet>
<div class="pz" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000;">

  <header class="hdr">
    <a class="iconbtn" href="Settings.dc.html" aria-label="Settings">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h4M12 17h8"></path><circle cx="15" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </a>
    <nav class="seg" aria-label="View">
      <a class="on" href="Main.dc.html" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="6" rx="2"></rect><rect x="4" y="14" width="16" height="6" rx="2"></rect></svg>Zones</a>
      <a href="Plan.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h8M9 12h11M6 18h9"></path></svg>Plan</a>
    </nav>
    <a class="iconbtn" href="Cities.dc.html" aria-label="Cities">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"></path></svg>
    </a>
  </header>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status">{{toast}}</div>
  </sc-if>

  <main class="list">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
      <article class="{{c.cls}}" aria-label="{{c.aria}}">
        <div class="sky" style="background: {{c.sky}};"></div>
        <div class="stars">
          <sc-for list="{{c.stars}}" as="s" hint-placeholder-count="0">
            <i class="star" style="left: {{s.x}}%; top: {{s.y}}%; width: {{s.r}}px; height: {{s.r}}px; opacity: {{s.o}};"></i>
          </sc-for>
        </div>
        <div class="scrim"></div>
        <svg class="arc" viewBox="0 0 358 124" preserveAspectRatio="none" aria-hidden="true">
          <path d="{{c.horizon}}" style="fill: none; stroke: rgba(255,255,255,.16); stroke-width: 1;"></path>
          <path d="{{c.below}}" style="fill: none; stroke: rgba(255,255,255,.16); stroke-width: 1.2; stroke-dasharray: 2 4;"></path>
          <path d="{{c.above}}" style="fill: none; stroke: rgba(255,255,255,.45); stroke-width: 1.4;"></path>
          <path d="{{c.work}}" style="fill: none; stroke: rgba(255,255,255,.6); stroke-width: 2.2; stroke-linecap: round;"></path>
        </svg>
        <div class="{{c.sunCls}}" style="left: {{c.sunX}}%; top: {{c.sunY}}%;"></div>
        <div class="content">
          <div class="row">
            <div class="title">
              <span class="city">{{c.name}}</span>
              <sc-for list="{{c.tags}}" as="t" hint-placeholder-count="0"><span class="tag">{{t.label}}</span></sc-for>
            </div>
            <span class="{{c.chipCls}}"><i></i>{{c.chip}}</span>
          </div>
          <div class="row end">
            <div class="time">{{c.hm}}<span class="sec">{{c.sec}}</span><span class="ampm">{{c.ampm}}</span></div>
            <div class="meta"><span>{{c.rel}}</span><span class="mono">{{c.utc}}</span></div>
          </div>
        </div>
      </article>
    </sc-for>
  </main>

  <section class="dock" aria-label="Time controls">
    <sc-if value="{{hasSentence}}" hint-placeholder-val="{{ false }}">
      <div class="{{sentenceCls}}" role="status" aria-live="polite">
        <div>{{sentence}}</div>
        <sc-if value="{{hasSugs}}" hint-placeholder-val="{{ false }}">
          <div class="sugs">
            <sc-for list="{{sugs}}" as="g" hint-placeholder-count="2"><button class="sug" type="button" onClick="{{g.pick}}">{{g.label}}</button></sc-for>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <div class="momentrow">
      <button class="iconbtn" type="button" aria-label="Share this time" onClick="{{share}}">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M6 12v6a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-6"></path></svg>
      </button>
      <div class="{{momentCls}}">
        <span class="dot"></span>
        <div class="mtext"><strong>{{momentMain}}</strong><span>{{momentSub}}</span></div>
      </div>
      <button class="iconbtn" type="button" aria-label="Back to now" disabled="{{nowDisabled}}" onClick="{{goNow}}">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"></path><path d="M4.5 4.5v4h4"></path></svg>
      </button>
    </div>

    <div class="ruler">
      <button class="chev" type="button" aria-label="One hour earlier" onClick="{{back1h}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <div class="{{trackCls}}" role="slider" tabindex="0" aria-label="Scrub time" aria-valuetext="{{momentAria}}" onPointerDown="{{rulerDown}}" onPointerMove="{{rulerMove}}" onPointerUp="{{rulerUp}}" onPointerCancel="{{rulerUp}}" onKeyDown="{{rulerKey}}">
        <sc-for list="{{ticks}}" as="k" hint-placeholder-count="20">
          <div class="{{k.cls}}" style="left: {{k.x}}px;"><i></i><span>{{k.label}}</span></div>
        </sc-for>
        <div class="needle"></div>
      </div>
      <button class="chev" type="button" aria-label="One hour later" onClick="{{fwd1h}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>

    <label class="cmd">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      <input type="text" value="{{query}}" onChange="{{onQuery}}" onKeyDown="{{onCmdKey}}" placeholder="3pm bristol to austin" aria-label="Convert a time" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false">
      <sc-if value="{{hasQuery}}" hint-placeholder-val="{{ false }}">
        <button class="clear" type="button" aria-label="Clear" onClick="{{clearQuery}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
      </sc-if>
    </label>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"use24h":{"editor":"boolean","default":true,"section":"Format"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.viewerTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    const you = this.allCities().find((c) => c.tz === this.viewerTz);
    this.state = { now: Date.now(), pinned: null, refId: you ? you.id : 'sao-paulo', query: '', toast: '', dragging: false };
    this.fmts = {};
    this.drag = null;
    this.h = {
      onQuery: (e) => this.setState({ query: e.target.value }),
      onCmdKey: (e) => {
        if (e.key === 'Enter') { e.preventDefault(); this.commit(); }
        else if (e.key === 'Escape') { this.setState({ query: '' }); }
      },
      clearQuery: () => this.setState({ query: '' }),
      goNow: () => this.setState({ pinned: null, query: '' }),
      share: () => this.flash('Link copied · ' + this.shareLabel()),
      back1h: () => this.shift(-3600000),
      fwd1h: () => this.shift(3600000),
      rulerDown: (e) => {
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* no capture */ }
        this.drag = { x: e.clientX, base: this.currentMoment() };
        this.setState({ dragging: true, query: '' });
      },
      rulerMove: (e) => {
        if (!this.drag) return;
        const dx = e.clientX - this.drag.x;
        if (Math.abs(dx) < 2) return;
        this.setState({ pinned: Math.round((this.drag.base - dx * 75000) / 300000) * 300000 });
      },
      rulerUp: () => { this.drag = null; this.setState({ dragging: false }); },
      rulerKey: (e) => {
        const step = e.shiftKey ? 3600000 : 900000;
        if (e.key === 'ArrowLeft') { e.preventDefault(); this.shift(-step); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); this.shift(step); }
        else if (e.key === 'Escape' || e.key === 'Home') { e.preventDefault(); this.setState({ pinned: null }); }
      },
    };
  }

  componentDidMount() {
    const tick = () => this.setState({ now: Date.now() });
    this.t0 = setTimeout(() => { tick(); this.t1 = setInterval(tick, 1000); }, 1000 - (Date.now() % 1000));
  }

  componentWillUnmount() {
    clearTimeout(this.t0); clearInterval(this.t1); clearTimeout(this.toastT);
  }

  allCities() {
    if (!this._cities) {
      this._cities = [
        { id: 'sao-paulo', name: 'São Paulo', cc: 'BR', tz: 'America/Sao_Paulo', lat: -23.55, lon: -46.63, hq: true, active: true },
        { id: 'austin', name: 'Austin', cc: 'US', tz: 'America/Chicago', lat: 30.27, lon: -97.74, active: true },
        { id: 'bristol', name: 'Bristol', cc: 'UK', tz: 'Europe/London', lat: 51.45, lon: -2.59, active: true },
        { id: 'bangalore', name: 'Bangalore', cc: 'IN', tz: 'Asia/Kolkata', lat: 12.97, lon: 77.59, active: true },
        { id: 'singapore', name: 'Singapore', cc: 'SG', tz: 'Asia/Singapore', lat: 1.35, lon: 103.82, active: true },
        { id: 'warsaw', name: 'Warsaw', cc: 'PL', tz: 'Europe/Warsaw', lat: 52.23, lon: 21.01 },
        { id: 'mexico-city', name: 'Mexico City', cc: 'MX', tz: 'America/Mexico_City', lat: 19.43, lon: -99.13 },
        { id: 'buenos-aires', name: 'Buenos Aires', cc: 'AR', tz: 'America/Argentina/Buenos_Aires', lat: -34.6, lon: -58.38 },
        { id: 'bogota', name: 'Bogotá', cc: 'CO', tz: 'America/Bogota', lat: 4.71, lon: -74.07 },
        { id: 'sydney', name: 'Sydney', cc: 'AU', tz: 'Australia/Sydney', lat: -33.87, lon: 151.21 },
      ];
    }
    return this._cities;
  }

  city(id) { return this.allCities().find((c) => c.id === id); }

  pad(n) { return String(n).padStart(2, '0'); }

  parts(ms, tz) {
    if (!this.fmts[tz]) {
      this.fmts[tz] = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', weekday: 'short' });
    }
    const o = {};
    for (const p of this.fmts[tz].formatToParts(new Date(ms))) o[p.type] = p.value;
    return { y: +o.year, mo: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute, s: +o.second, wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(o.weekday) };
  }

  offset(ms, tz) {
    const p = this.parts(ms, tz);
    return Math.round((Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(ms / 1000) * 1000) / 60000);
  }

  zoned(y, mo, d, h, mi, tz) {
    const guess = Date.UTC(y, mo - 1, d, h, mi);
    const first = guess - this.offset(guess, tz) * 60000;
    return guess - this.offset(first, tz) * 60000;
  }

  utcLabel(min) {
    const a = Math.abs(min);
    const m = a % 60;
    return 'UTC' + (min < 0 ? '−' : '+') + Math.floor(a / 60) + (m ? ':' + this.pad(m) : '');
  }

  dayNum(p) { return Date.UTC(p.y, p.mo - 1, p.d) / 86400000; }

  relLabel(p, vp, long) {
    const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const abs = WD[p.wd] + ' ' + p.d + ' ' + MON[p.mo - 1];
    const diff = this.dayNum(p) - this.dayNum(vp);
    const rel = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday' : '';
    if (long) return rel ? rel + ', ' + abs : abs;
    return rel || abs;
  }

  hm(p, use24) {
    if (use24) return this.pad(p.h) + ':' + this.pad(p.mi);
    return (((p.h + 11) % 12) + 1) + ':' + this.pad(p.mi) + (p.h < 12 ? ' AM' : ' PM');
  }

  holidays() {
    if (!this._hol) {
      this._hol = {
        BR: { '2026-10-12': 'Aparecida', '2026-11-02': 'Finados', '2026-11-15': 'República', '2026-11-20': 'Consciência Negra', '2026-12-25': 'Natal' },
        US: { '2026-11-26': 'Thanksgiving', '2026-12-25': 'Christmas' },
        UK: { '2026-12-25': 'Christmas', '2026-12-28': 'Boxing Day' },
        IN: { '2026-12-25': 'Christmas' },
        SG: { '2026-12-25': 'Christmas' },
      };
    }
    return this._hol;
  }

  workState(p, cc, use24) {
    const key = p.y + '-' + this.pad(p.mo) + '-' + this.pad(p.d);
    const hol = (this.holidays()[cc] || {})[key];
    if (hol) return { kind: 'holiday', label: 'Holiday · ' + hol };
    if (p.wd === 0 || p.wd === 6) return { kind: 'weekend', label: 'Weekend' };
    const m = p.h * 60 + p.mi;
    if (m >= 540 && m < 1080) return { kind: 'working', label: 'Working' };
    if (m >= 420 && m < 540) return { kind: 'soon', label: use24 === false ? 'Starts 9 AM' : 'Starts 09:00' };
    if (m >= 1080 && m < 1200) return { kind: 'off', label: 'After hours' };
    return { kind: 'off', label: 'Off hours' };
  }

  sunEl(ms, lat, lon) {
    const rad = Math.PI / 180;
    const d = ms / 86400000 - 10957.5;
    const g = (357.529 + 0.98560028 * d) * rad;
    const q = 280.459 + 0.98564736 * d;
    const L = (q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * rad;
    const e = (23.439 - 0.00000036 * d) * rad;
    const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
    const dec = Math.asin(Math.sin(e) * Math.sin(L));
    const gmst = (((18.697374558 + 24.06570982441908 * d) % 24) + 24) % 24;
    const ha = (gmst * 15 + lon) * rad - ra;
    return Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
  }

  mix(x, y, t) {
    const p = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));
    const A = p(x); const B = p(y);
    return 'rgb(' + A.map((v, k) => Math.round(v + (B[k] - v) * t)).join(',') + ')';
  }

  sky(el) {
    const K = [
      [-90, '#02040b', '#050a1b', '#0a1330'],
      [-18, '#03060f', '#081129', '#111c42'],
      [-12, '#060c22', '#0f1c48', '#1f2d5e'],
      [-6, '#0c1a48', '#2b3878', '#5a4a7e'],
      [-2, '#162c66', '#46508a', '#a8644f'],
      [2, '#244685', '#5e6a9c', '#c98455'],
      [6, '#28539a', '#5480b4', '#b0957a'],
      [15, '#265aa8', '#4a7cbb', '#7f9fc0'],
      [35, '#2259b2', '#3c75c0', '#6f98c6'],
      [90, '#1e56b2', '#386fbf', '#6893c4'],
    ];
    let i = 0;
    while (i < K.length - 2 && el > K[i + 1][0]) i++;
    const a = K[i]; const b = K[i + 1];
    const t = Math.max(0, Math.min(1, (el - a[0]) / (b[0] - a[0])));
    return 'linear-gradient(180deg, ' + this.mix(a[1], b[1], t) + ' 0%, ' + this.mix(a[2], b[2], t) + ' 58%, ' + this.mix(a[3], b[3], t) + ' 100%)';
  }

  stars(id, alpha) {
    if (alpha < 0.03) return [];
    let seed = 7;
    for (const ch of id) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
    const rnd = () => {
      seed = (seed + 0x6D2B79F5) >>> 0;
      let t = seed;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const out = [];
    for (let i = 0; i < 26; i++) {
      const x = 3 + rnd() * 94; const y = 4 + rnd() * 58; const z = rnd(); const o = 0.3 + rnd() * 0.7;
      out.push({ x: x.toFixed(2), y: y.toFixed(2), r: z < 0.15 ? 2 : z < 0.5 ? 1.5 : 1, o: (o * alpha).toFixed(2) });
    }
    return out;
  }

  card(c, moment, live, refId, vp, use24, temp) {
    const p = this.parts(moment, c.tz);
    const el = this.sunEl(moment, c.lat, c.lon);
    const st = this.workState(p, c.cc, use24);
    const W = 358; const H = 124; const HY = 80; const K = 0.7;
    const mins = p.h * 60 + p.mi + p.s / 60;
    const midnight = moment - mins * 60000;
    let above = ''; let below = ''; let prevUp = null; let lx = 0; let ly = 0;
    for (let i = 0; i <= 96; i++) {
      const e = this.sunEl(midnight + i * 900000, c.lat, c.lon);
      const x = (i / 96) * W; const y = HY - e * K; const up = e >= 0;
      const seg = (prevUp === up ? 'L' : (prevUp === null ? 'M' : 'M' + lx.toFixed(1) + ' ' + ly.toFixed(1) + ' L')) + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      if (up) above += seg; else below += seg;
      prevUp = up; lx = x; ly = y;
    }
    const sunTop = Math.max(6, Math.min(94, ((HY - el * K) / H) * 100));
    const tags = [];
    if (c.hq) tags.push({ label: 'HQ' });
    if (c.tz === this.viewerTz) tags.push({ label: 'You' });
    if (temp) tags.push({ label: 'Not saved' });
    const hm = use24 ? this.pad(p.h) + ':' + this.pad(p.mi) : (((p.h + 11) % 12) + 1) + ':' + this.pad(p.mi);
    const ampm = use24 ? '' : (p.h < 12 ? 'AM' : 'PM');
    const rel = this.relLabel(p, vp, false);
    const utc = this.utcLabel(this.offset(moment, c.tz));
    return {
      cls: 'card' + (c.id === refId ? ' ref' : '') + (temp ? ' temp' : ''),
      sky: this.sky(el),
      stars: this.stars(c.id, Math.max(0, Math.min(1, (-el - 3) / 9))),
      horizon: 'M0 ' + HY + ' L' + W + ' ' + HY,
      work: 'M' + ((9 / 24) * W).toFixed(1) + ' ' + HY + ' L' + ((18 / 24) * W).toFixed(1) + ' ' + HY,
      above, below,
      sunCls: 'sun' + (el < 0 ? ' down' : ''),
      sunX: ((mins / 1440) * 100).toFixed(2),
      sunY: sunTop.toFixed(2),
      name: c.name, tags,
      chipCls: 'chip ' + st.kind, chip: st.label,
      hm, ampm, sec: live ? ':' + this.pad(p.s) : '',
      rel, utc,
      aria: c.name + ', ' + hm + (ampm ? ' ' + ampm : '') + ', ' + rel + ', ' + st.label + ', ' + utc,
    };
  }

  currentMoment() { return this.state.pinned != null ? this.state.pinned : this.state.now; }

  shift(d) { this.setState({ query: '', pinned: Math.round((this.currentMoment() + d) / 900000) * 900000 }); }

  flash(msg) {
    this.setState({ toast: msg });
    clearTimeout(this.toastT);
    this.toastT = setTimeout(() => this.setState({ toast: '' }), 1800);
  }

  shareLabel() {
    if (this.state.pinned == null) return 'live view';
    const ref = this.city(this.state.refId) || this.allCities()[0];
    const p = this.parts(this.state.pinned, ref.tz);
    return this.relLabel(p, this.parts(this.state.now, this.viewerTz), false) + ' ' + this.hm(p, this.props.use24h ?? true) + ' ' + ref.name;
  }

  commit() {
    const r = this.parse(this.state.query, this.state.now);
    if (r && r.ok) this.setState({ pinned: r.isNow ? null : r.epoch, refId: r.srcId, query: '' });
  }

  aliases() {
    if (!this._al) {
      const m = {
        'sao-paulo': ['sao paulo', 'saopaulo', 'sp', 'brt', 'brazil', 'hq'],
        austin: ['austin', 'atx', 'texas'],
        bristol: ['bristol', 'uk', 'england'],
        bangalore: ['bangalore', 'bengaluru', 'blr', 'ist', 'india'],
        singapore: ['singapore', 'sg', 'sgt'],
        warsaw: ['warsaw', 'poland'],
        'mexico-city': ['mexico city', 'cdmx', 'mexico'],
        'buenos-aires': ['buenos aires', 'argentina'],
        bogota: ['bogota', 'colombia'],
        sydney: ['sydney', 'australia'],
      };
      const out = [];
      for (const id in m) for (const a of m[id]) out.push([a, id]);
      out.sort((a, b) => b[0].length - a[0].length);
      this._al = out;
    }
    return this._al;
  }

  lev(a, b) {
    const d = [];
    for (let i = 0; i <= a.length; i++) { d[i] = [i]; }
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }

  parse(q, now) {
    let s = (q || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    s = s.replace(/→|->|=>/g, ' to ').replace(/[?!,;]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (!s) return null;
    let rest = ' ' + s + ' ';
    const take = (mm) => { rest = rest.replace(mm[0], ' '); };
    let dayOff = null; let wd = null; let h = null; let mi = 0; let amb = null; let mm;
    mm = rest.match(/ (today|tonight|tomorrow|tmrw|tmr|yesterday) /);
    if (mm) { dayOff = { today: 0, tonight: 0, tomorrow: 1, tmrw: 1, tmr: 1, yesterday: -1 }[mm[1]]; take(mm); }
    mm = rest.match(/ (?:next |this )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues|tue|wed|thurs|thu|fri|sat) /);
    if (mm) { wd = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'].indexOf(mm[1].slice(0, 3)); take(mm); }
    mm = rest.match(/ (noon|midday|midnight) /);
    if (mm) { h = mm[1] === 'midnight' ? 0 : 12; take(mm); }
    if (h === null) { mm = rest.match(/ ([01]\d|2[0-3])([0-5]\d) /); if (mm) { h = +mm[1]; mi = +mm[2]; take(mm); } }
    if (h === null) {
      mm = rest.match(/ (\d{1,2})(?:[:.h]([0-5]\d))? ?(am|pm|a|p)? /);
      if (mm) {
        const n = +mm[1];
        if (mm[3]) {
          if (n < 1 || n > 12) return { ok: false, msg: '“' + mm[1] + mm[3] + '” isn’t a valid time' };
          h = (n % 12) + (mm[3][0] === 'p' ? 12 : 0); mi = mm[2] ? +mm[2] : 0;
        } else if (mm[2]) {
          if (n > 23) return { ok: false, msg: '“' + mm[1] + ':' + mm[2] + '” isn’t a valid time' };
          h = n; mi = +mm[2];
        } else if (n >= 13 && n <= 23) { h = n; }
        else if (n >= 1 && n <= 12) { amb = n; h = n; }
        else if (n === 0 || n === 24) { h = 0; }
        else return { ok: false, msg: '“' + mm[1] + '” isn’t a time' };
        take(mm);
      }
    }
    const halves = rest.split(/ (?:to|in|into|vs) /);
    const findAll = (str) => {
      let x = ' ' + str.trim() + ' ';
      const found = [];
      for (const pair of this.aliases()) {
        const at = x.indexOf(' ' + pair[0] + ' ');
        if (at >= 0) { found.push({ id: pair[1], at }); x = x.replace(' ' + pair[0] + ' ', '  '); }
      }
      found.sort((a, b) => a.at - b.at);
      const ids = [];
      for (const f of found) if (ids.indexOf(f.id) < 0) ids.push(f.id);
      return { ids, rest: x };
    };
    const L = findAll(halves[0]);
    const R = findAll(halves.slice(1).join(' '));
    const fill = { what: 1, whats: 1, is: 1, the: 1, time: 1, at: 1, on: 1, me: 1, show: 1, convert: 1, from: 1, and: 1, please: 1, it: 1, be: 1, will: 1, when: 1, for: 1, "o'clock": 1, oclock: 1, "what's": 1 };
    const shifty = { cst: 'austin', cdt: 'austin', gmt: 'bristol', bst: 'bristol', cet: 'warsaw', cest: 'warsaw', aest: 'sydney', aedt: 'sydney', est: '', edt: '', pst: '', pdt: '' };
    const left = (L.rest + ' ' + R.rest).split(' ').filter((w) => w && !fill[w]);
    if (left.length) {
      const w = left[0];
      if (w in shifty) {
        const sug = shifty[w] ? this.city(shifty[w]) : null;
        return { ok: false, msg: '“' + w.toUpperCase() + '” changes with daylight saving — name a city instead', sugs: sug ? [{ label: sug.name, q: s.replace(w, sug.name.toLowerCase()) }] : [] };
      }
      let best = null; let bestD = 3;
      for (const pair of this.aliases()) {
        if (pair[0].length < 3) continue;
        const dist = this.lev(w, pair[0]);
        if (dist < bestD) { bestD = dist; best = pair; }
      }
      return { ok: false, msg: 'Didn’t recognise “' + w + '”', sugs: best ? [{ label: this.city(best[1]).name, q: s.replace(w, best[0]) }] : [] };
    }
    let dests = R.ids.slice();
    if (L.ids.length > 1) dests = L.ids.slice(1).concat(dests);
    const srcId = L.ids[0] || this.state.refId;
    if (!L.ids[0] && !dests.length && h === null && dayOff === null && wd === null) return { ok: false, msg: 'Try “3pm bristol to austin” or “tomorrow 10:00 sp”' };
    if (amb !== null) {
      const lo = amb === 12 ? 0 : amb; const hi = amb === 12 ? 12 : amb + 12;
      const re = new RegExp('(^|\\s)' + amb + '(?=\\s|$)');
      return { ok: false, msg: amb + ' in the morning or the afternoon?', sugs: [lo, hi].map((v) => ({ label: this.pad(v) + ':00', q: s.replace(re, '$1' + this.pad(v) + ':00') })) };
    }
    const isNow = h === null && dayOff === null && wd === null;
    if (h === null && !isNow) return { ok: false, msg: 'Add a time — e.g. “tomorrow 10:00”' };
    let epoch = now;
    if (!isNow) {
      const src = this.city(srcId);
      const p = this.parts(now, src.tz);
      const add = wd !== null ? ((wd - p.wd + 7) % 7) : (dayOff || 0);
      const base = new Date(Date.UTC(p.y, p.mo - 1, p.d + add));
      epoch = this.zoned(base.getUTCFullYear(), base.getUTCMonth() + 1, base.getUTCDate(), h, mi, src.tz);
    }
    return { ok: true, epoch, isNow, srcId, dests, implicit: !L.ids[0] };
  }

  sentence(r, vp, use24) {
    const src = this.city(r.srcId);
    const sp = this.parts(r.epoch, src.tz);
    const head = r.isNow ? 'Now' : this.relLabel(sp, vp, true);
    const srcTxt = this.hm(sp, use24) + ' ' + src.name;
    const ds = r.dests.filter((id) => id !== r.srcId).map((id) => {
      const c = this.city(id);
      const p = this.parts(r.epoch, c.tz);
      const dd = this.dayNum(p) - this.dayNum(sp);
      return this.hm(p, use24) + ' ' + c.name + (dd > 0 ? ' (+1d)' : dd < 0 ? ' (−1d)' : '');
    });
    return head + ' · ' + srcTxt + (ds.length ? ' → ' + ds.join(' · ') : '');
  }

  delta(ms) {
    let m = Math.round(Math.abs(ms) / 60000);
    if (m === 0) return 'Now';
    const d = Math.floor(m / 1440); m -= d * 1440;
    const h = Math.floor(m / 60); m -= h * 60;
    return (ms < 0 ? '−' : '+') + [d ? d + 'd' : '', h ? h + 'h' : '', m && !d ? m + 'm' : ''].filter(Boolean).join(' ');
  }

  ticks(moment, ref, active, use24) {
    const C = 126; const PX = 75000;
    const first = Math.ceil((moment - C * PX) / 900000) * 900000;
    const list = [];
    for (let t = first; t <= moment + C * PX; t += 900000) {
      const rp = this.parts(t, ref.tz);
      let n = 0;
      for (const c of active) if (this.workState(this.parts(t, c.tz), c.cc).kind === 'working') n++;
      const label = rp.mi === 0 ? (use24 ? this.pad(rp.h) : (((rp.h + 11) % 12) + 1) + (rp.h < 12 ? 'a' : 'p')) : '';
      list.push({ x: C + (t - moment) / PX, major: rp.mi === 0, n, label });
    }
    let max = 0;
    for (const k of list) if (k.n > max) max = k.n;
    return list.map((k) => ({ x: k.x.toFixed(1), cls: 'tk' + (k.major ? ' major' : '') + (k.n === max && max >= 2 ? ' hot' : ''), label: k.label }));
  }

  renderVals() {
    const s = this.state;
    const use24 = this.props.use24h ?? true;
    const r = s.query.trim() ? this.parse(s.query, s.now) : null;
    const ok = !!(r && r.ok);
    const moment = ok ? r.epoch : (s.pinned != null ? s.pinned : s.now);
    const live = ok ? r.isNow : s.pinned == null;
    const refId = ok ? r.srcId : s.refId;
    const vp = this.parts(s.now, this.viewerTz);
    const active = this.allCities().filter((c) => c.active);
    const extra = ok ? r.dests.map((id) => this.city(id)).filter((c) => !c.active) : [];
    const cards = active.map((c) => this.card(c, moment, live, refId, vp, use24, false))
      .concat(extra.map((c) => this.card(c, moment, live, refId, vp, use24, true)));
    const ref = this.city(refId) || active[0];
    const rp = this.parts(moment, ref.tz);
    let momentCls = 'moment'; let momentMain = 'Live'; let momentSub = this.relLabel(vp, vp, true);
    if (ok && !r.isNow) { momentCls += ' preview'; momentMain = 'Preview'; momentSub = 'Enter to set · Esc to clear'; }
    else if (!live) { momentCls += ' pinned'; momentMain = this.delta(moment - s.now); momentSub = this.relLabel(rp, vp, false) + ' · ' + this.hm(rp, use24) + ' ' + ref.name; }
    let sentence = ''; let sentenceCls = 'sentence'; let sugs = [];
    if (r) {
      if (r.ok) sentence = this.sentence(r, vp, use24);
      else { sentence = r.msg; sentenceCls += ' err'; sugs = (r.sugs || []).map((g) => ({ label: g.label, pick: () => this.setState({ query: g.q }) })); }
    }
    return Object.assign({}, this.h, {
      cards,
      momentCls, momentMain, momentSub,
      momentAria: this.relLabel(rp, vp, true) + ', ' + this.hm(rp, use24) + ' ' + ref.name,
      nowDisabled: live,
      hasSentence: !!sentence, sentence, sentenceCls, sugs, hasSugs: sugs.length > 0,
      ticks: this.ticks(moment, ref, active, use24),
      trackCls: 'track' + (s.dragging ? ' drag' : ''),
      query: s.query, hasQuery: !!s.query,
      toast: s.toast, hasToast: !!s.toast,
    });
  }
}
</script>
</body>
